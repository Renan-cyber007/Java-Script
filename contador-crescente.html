<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador Crescente</title>
    <style>
        body{
            background-color: rgb(41, 119, 221);
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Contador Crescente ev1</h1>
    <input type="number" name="n1" id="n1" placeholder="Quantos Passos Voce deu?">
    <button onclick="contar()">Contar</button>
    <div id="res"></div>
    <script>
        function contar() { 
        let contador = 1
        let num = document.getElementById("n1")
        let fim = Number(num.value)
        let res = document.getElementById("res")
        res.innerHTML = ''
        if (num.value.length ==0){
            res.innerHTML = 'Por favor, digite um número!'
        }
        else { 
        while (contador <= fim) {
            res.innerHTML += 'Passo ' + contador + '<br>'
            contador++
        }
        }
        }
    </script>
</body>
</html>
