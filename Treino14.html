<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Media Escolar</title>
</head>
<body>
    <script>
        var n1 = parseFloat(window.prompt("Digite a sua nota 1: "))
        var n2 = parseFloat(window.prompt("Digite a sua nota 2: "))
        var res = parseFloat(n1  + n2) /2
        if(res =>6){ 
            window.alert("Sua Nota Média é "+ res + " Voce Foi APROVADO" )

        }else {
            window.alert("Sua Nota Média é "+ res + "Voce Foi REPROVADO")
        }

    
    </script>
</body>
</html>
