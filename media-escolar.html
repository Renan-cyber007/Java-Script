<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Escolar com Status do Aluno</title>
    <style>
        body {
            background-color: cornflowerblue;
            font-family: Arial, Helvetica, sans-serif;
         }
    </style>
</head>
<body>
    <h1>Media Escolar com Status do Aluno</h1>
    <input type="number" name="txtn1" id="txtn1" placeholder="Digite a Nota 1">
    <input type="number" name="txtn2" id="txtn2" placeholder="Digite a Nota 2">
    <button onclick="verificar()">Verificar</button>
    <div id="res"></div>
    <script>
     if (n1.value.length==0 && n2.value.length ==0){ 
            res.innerHTML='Numero Invalido'
        }
    else { 
     function verificar() {
        var n1 = Number(document.getElementById("txtn1").value);
        var n2 = Number(document.getElementById("txtn2").value);
        var res = document.getElementById("res");
        var media = (n1 + n2) / 2;
        if (media < 5) {
            res.innerHTML = `Sua média foi ${media} <br>Situação: REPROVADO`;
        } else if (media < 7) {
            res.innerHTML = `Sua média foi ${media} <br>Situação: RECUPERAÇÃO`;
        } else {
            res.innerHTML = `Sua média foi ${media} <br>Situação: APROVADO`;
        
        }
        }
    
    }
</script>
</body>
</html>
