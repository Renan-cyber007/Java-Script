<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronometro</title>
    <style>
        body {
            background-color: rgba(0, 0, 0, 0.925);
            font-family: Arial, sans-serif;
            color: gold;
            text-align: center;
        }
        h1 {
            font-size: 70px; 
        }
        div {
            font-size: 65px;
            margin-bottom: 20px;
        }
        input[type="button"] {
            margin: 0 5px; 
        } 
        #start {
            background-color: green;
            color: white;
            font-size: 30px
        }

        #pause {
            background-color: yellow;
            color: black;
            font-size: 30px
        }

        #stop {
            background-color: red;
            color: white;
            font-size: 30px
        }
    </style>
</head>
<body>
    <h1>Cronometro</h1>
    <div id="tempo">00:00</div>
    <input type="button" name="btnstart" id="start" value="iniciar">
    <input type="button" name="btnpause" id="pause" value="pausar">
    <input type="button" name="btnstop" id="stop" value="parar">
    
    <script>
        const tempo = document.getElementById("tempo")
        const iniciar = document.getElementById("start")
        const parar = document.getElementById("stop")
        const pausar = document.getElementById("pause")
        let segundos = 0
        let rodando = false 
        let temporizador = null

        function contar (){
           segundos = segundos + 1
           let minutos = Math.floor(segundos / 60)
           let segundosRestantes = segundos % 60
           tempo.textContent = String(minutos).padStart(2, "0") + ":" + String(segundosRestantes).padStart(2, "0");
        }

        iniciar.addEventListener("click", function() {
            if (!rodando) {
                temporizador = setInterval(contar, 1000)  
                rodando = true
            }
        })

        pausar.addEventListener("click", function() {
            clearInterval(temporizador)  
            rodando = false
        })

        parar.addEventListener("click", function (){
            clearInterval(temporizador)
            segundos = 0
            tempo.textContent = "00:00"
            rodando = false
        })
    </script>
</body>
</html>
